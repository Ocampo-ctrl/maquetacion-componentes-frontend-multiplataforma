<main class="layout">
  <section class="menu">
    <h1>Restaurante La Bonga del Sinú</h1>
    <div class="menu__grid">
      @for (p of products; track p.id) {
        <app-product-card
          [title]="p.name"
          [description]="p.desc"
          [price]="p.price"
          (add)="add(p)"
        />
      }
    </div>
  </section>

  <aside class="side" [class.side--open]="drawerOpen">
    <app-order-summary
      [items]="cart"
      (increase)="increase($event)"
      (decrease)="decrease($event)"
      (confirm)="confirm()"
    />
  </aside>

  <button class="fab" (click)="drawerOpen = !drawerOpen">
    {{ drawerOpen ? 'Cerrar' : 'Ver pedido (' + count + ')' }}
  </button>
</main>
